<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Events | Hackathon Management Platform</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Hackathon Management Platform</h1>
        <p>Hackathon event planning</p>
      </div>
      <nav class="nav-links">
        <a href="/">Dashboard</a>
        <a href="/users">Users</a>
        <a href="/events">Events</a>
        <a href="/projects">Projects</a>
        <a href="/judging">Judging</a>
      </nav>
    </header>

    <main class="container single-column">
      <section class="card">
        <h2>Event Creation</h2>
        <form id="event-form" class="form-grid">
          <input type="text" id="event-name" placeholder="Event title" required />
          <input type="date" id="event-date" required />
          <input type="text" id="event-location" placeholder="Location" required />
          <textarea
            id="event-description"
            rows="3"
            placeholder="Event description"
            required
          ></textarea>
          <button type="submit">Create Event</button>
        </form>
        <div id="events-list" class="list-grid"></div>
      </section>
    </main>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
