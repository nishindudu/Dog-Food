<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Judging | Hackathon Management Platform</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Hackathon Management Platform</h1>
        <p>Project scoring and judging insights</p>
      </div>
      <nav class="nav-links">
        <a href="/">Dashboard</a>
        <a href="/users">Users</a>
        <a href="/events">Events</a>
        <a href="/projects">Projects</a>
        <a href="/judging">Judging</a>
      </nav>
    </header>

    <main class="container single-column">
      <section class="card">
        <h2>Judging</h2>
        <form id="score-form" class="form-grid">
          <select id="score-project" required>
            <option value="">Select project</option>
          </select>
          <input type="text" id="judge-name" placeholder="Judge name" required />
          <input
            type="number"
            id="innovation-score"
            min="1"
            max="10"
            placeholder="Innovation (1-10)"
            required
          />
          <input
            type="number"
            id="execution-score"
            min="1"
            max="10"
            placeholder="Execution (1-10)"
            required
          />
          <input
            type="number"
            id="impact-score"
            min="1"
            max="10"
            placeholder="Impact (1-10)"
            required
          />
          <button type="submit">Submit Score</button>
        </form>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Project</th>
                <th>Judge</th>
                <th>Innovation</th>
                <th>Execution</th>
                <th>Impact</th>
                <th>Total</th>
              </tr>
            </thead>
            <tbody id="scores-table"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
